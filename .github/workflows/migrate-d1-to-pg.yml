name: Migrate D1 to Postgres (one-time)

# Jalankan SEKALI secara manual setelah db/schema.sql diterapkan ke
# Postgres (Aiven), buat mindahin data yang sempat ke-tulis di D1 sebelum
# pipeline pindah sepenuhnya. Bukan bagian jadwal rutin -- gak ada
# `schedule:`, cuma workflow_dispatch.
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Sumber (D1, lama)
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # Tujuan (Postgres/Aiven, baru)
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_DATABASE: ${{ secrets.PG_DATABASE }}
      PG_CA_CERT: ${{ secrets.PG_CA_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - working-directory: pipeline
        run: python migrate_d1_to_pg.py
