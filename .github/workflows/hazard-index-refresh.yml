name: Hazard index refresh (banjir & longsor)

# Sengaja TERPISAH dari monthly-pipeline.yml: hazard_index_flood/landslide
# bukan time-series hasil ML (gak ada training-nya, cuma sampling ulang
# index InaRISK BNPB ke skala 0-1 kita), jadi strukturnya beda -- tapi
# jadwalnya tetap BULANAN, ngikutin dugaan kuat InaRISK sendiri update
# peta-nya tiap bulan (belum sempat diverifikasi resmi -- kalau ternyata
# InaRISK update-nya lebih jarang/lebih sering, sesuaikan cron di bawah).
on:
  schedule:
    - cron: "0 1 1 * *"   # tanggal 1 tiap bulan, 01:00 UTC (1 jam setelah monthly-pipeline)
  workflow_dispatch: {}

jobs:
  refresh-hazard-index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_DATABASE: ${{ secrets.PG_DATABASE }}
      PG_CA_CERT: ${{ secrets.PG_CA_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - working-directory: pipeline
        run: python fetch_hazard_index.py
