name: Hazard index refresh (banjir & longsor)

# Sengaja TERPISAH dari monthly-pipeline.yml: hazard_index_flood/landslide
# bukan time-series hasil ML, cuma indeks statis dari InaRISK BNPB yang
# jarang berubah. Jalan manual atau tahunan, bukan tiap bulan.
on:
  schedule:
    - cron: "0 0 1 1 *"   # 1 Januari, jaga-jaga kalau InaRISK update peta
  workflow_dispatch: {}

jobs:
  refresh-hazard-index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_DATABASE: ${{ secrets.PG_DATABASE }}
      PG_CA_CERT: ${{ secrets.PG_CA_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - working-directory: pipeline
        run: python fetch_hazard_index.py
