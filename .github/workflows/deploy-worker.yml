name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "d1/schema.sql"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate wrangler.toml dari template (isi database_id dari secret)
        run: |
          sed "s/__D1_DATABASE_ID__/${{ secrets.D1_DATABASE_ID }}/" \
            wrangler.toml.example > wrangler.toml

      - name: Install dependencies
        run: npm install

      - name: Terapkan skema D1 (idempotent -- CREATE TABLE IF NOT EXISTS style aman diulang)
        run: npx wrangler d1 execute perseus-shelter-db --remote --file=../d1/schema.sql

      - name: Deploy
        run: npx wrangler deploy
