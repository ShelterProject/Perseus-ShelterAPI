name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "db/schema.sql"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PGHOST: ${{ secrets.PG_HOST }}
      PGPORT: ${{ secrets.PG_PORT }}
      PGUSER: ${{ secrets.PG_USER }}
      PGPASSWORD: ${{ secrets.PG_PASSWORD }}
      PGDATABASE: ${{ secrets.PG_DATABASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Terapkan skema ke Postgres (idempotent -- IF NOT EXISTS)
        run: |
          echo "${{ secrets.PG_CA_CERT }}" > /tmp/aiven-ca.pem
          psql "sslmode=verify-ca sslrootcert=/tmp/aiven-ca.pem" -f db/schema.sql

      - name: Generate wrangler.toml dari template (isi Hyperdrive ID dari secret)
        working-directory: worker
        run: |
          sed "s/__HYPERDRIVE_ID__/${{ secrets.HYPERDRIVE_ID }}/" \
            wrangler.toml.example > wrangler.toml

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
