name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "db/schema.sql"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PGHOST: ${{ secrets.PG_HOST }}
      PGPORT: ${{ secrets.PG_PORT }}
      PGUSER: ${{ secrets.PG_USER }}
      PGPASSWORD: ${{ secrets.PG_PASSWORD }}
      PGDATABASE: ${{ secrets.PG_DATABASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Terapkan skema ke Postgres (idempotent -- IF NOT EXISTS)
        run: |
          echo "${{ secrets.PG_CA_CERT }}" > /tmp/aiven-ca.pem
          psql "sslmode=verify-ca sslrootcert=/tmp/aiven-ca.pem" -f db/schema.sql

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Deploy
        working-directory: worker
        run: cp wrangler.toml.example wrangler.toml && npx wrangler deploy

      # Worker gak konek lewat Hyperdrive -- kredensial Postgres (sama
      # persis yang dipakai pipeline Python) disimpan sebagai Worker
      # Secret, bukan di wrangler.toml. `wrangler secret put` idempotent,
      # aman dipanggil ulang tiap deploy.
      - name: Set Worker secrets (kredensial Postgres, sama kayak pipeline)
        working-directory: worker
        run: |
          echo "${{ secrets.PG_HOST }}" | npx wrangler secret put PG_HOST
          echo "${{ secrets.PG_PORT }}" | npx wrangler secret put PG_PORT
          echo "${{ secrets.PG_USER }}" | npx wrangler secret put PG_USER
          echo "${{ secrets.PG_PASSWORD }}" | npx wrangler secret put PG_PASSWORD
          echo "${{ secrets.PG_DATABASE }}" | npx wrangler secret put PG_DATABASE
          echo "${{ secrets.PG_CA_CERT }}" | npx wrangler secret put PG_CA_CERT
