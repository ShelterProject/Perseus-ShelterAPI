name: Apply Postgres schema

# Worker/Hyperdrive deploy sengaja belum masuk sini -- baru terapkan
# db/schema.sql ke Postgres (Aiven) dulu, biar pipeline fetch_*/train_*
# punya tabel buat ditulis. Langkah deploy Worker + Hyperdrive disambung
# lagi belakangan setelah setup TLS/CA-nya beres.
on:
  push:
    branches: [main]
    paths:
      - "db/schema.sql"
  workflow_dispatch: {}

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terapkan skema ke Postgres (idempotent -- IF NOT EXISTS)
        env:
          PGHOST: ${{ secrets.PG_HOST }}
          PGPORT: ${{ secrets.PG_PORT }}
          PGUSER: ${{ secrets.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGDATABASE: ${{ secrets.PG_DATABASE }}
        run: |
          echo "${{ secrets.PG_CA_CERT }}" > /tmp/aiven-ca.pem
          psql "sslmode=verify-ca sslrootcert=/tmp/aiven-ca.pem" -f db/schema.sql
