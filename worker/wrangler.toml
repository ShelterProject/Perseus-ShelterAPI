name = "perseus-shelter-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# ID database D1 diisi setelah `wrangler d1 create perseus-shelter-db`,
# JANGAN commit ID/kredensial nyata di sini kalau repo tetap public --
# gunakan `wrangler.toml` lokal yang di-gitignore, atau override lewat
# `wrangler deploy --var` / Cloudflare dashboard.
[[d1_databases]]
binding = "DB"
database_name = "perseus-shelter-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
